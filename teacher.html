<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Кабинет преподавателя · Мат-повтор</title>
<link rel="stylesheet" href="style.css?v=19">
<style>
  main{max-width:640px;margin:0 auto;padding:16px}
  .tbl{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .tbl .t{flex:1;min-width:0}
  .tbl .t span{display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
  select,textarea{width:100%;box-sizing:border-box;margin:6px 0;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font:inherit}
  code.k{font-size:18px;letter-spacing:2px}
</style>
</head>
<body>
<main>
  <h2>Кабинет преподавателя</h2>

  <div class="panel" id="login">
    <h3>Вход</h3>
    <input id="code" type="password" placeholder="Код преподавателя" autocomplete="off">
    <button id="enter" class="primary">Войти</button>
    <p class="muted small" id="err" hidden></p>
  </div>

  <div id="work" hidden>
    <div class="panel">
      <h3>Назначить тему классу</h3>
      <select id="cls"></select>
      <select id="lec"></select>
      <textarea id="note" rows="2" maxlength="300" placeholder="Комментарий (необязательно), например: к практике в четверг"></textarea>
      <label class="row">Повторить до <input id="due" type="date"></label>
      <button id="assign" class="primary">Назначить и разослать</button>
      <p class="muted small" id="res" hidden></p>
    </div>

    <div class="panel">
      <h3>Классы</h3>
      <div class="muted small legend">Дайте студентам код класса: на сайте «Настройки» → «Мой класс». Войти могут те, кто подключил Telegram.</div>
      <div id="classes"></div>
      <input id="newName" maxlength="60" placeholder="Название нового класса, например 1 курс, группа А">
      <button id="addCls" class="ghost">Создать класс</button>
    </div>

    <div class="panel">
      <h3>Последние задания</h3>
      <div id="tasks"></div>
    </div>
    <button id="exit" class="linkbtn">Выйти</button>
  </div>
</main>
<script src="lectures.js"></script>
<script src="config.js"></script>
<script>
const $ = (s) => document.querySelector(s), API = window.MR_CONFIG.api;
let CODE = '', DATA = { classes: [], tasks: [] };
const lecs = (window.BUILTIN_LECTURES || []).map((l) => ({ id: 'b-' + l.id, title: l.title }));
$('#lec').innerHTML = lecs.map((l) => `<option value="${l.id}">${l.title.replace(/[<>&"]/g, '')}</option>`).join('');

async function call(body) {
  const r = await fetch(API + '/teacher', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ code: CODE }, body)) });
  if (!r.ok) { const e = new Error(String(r.status)); e.status = r.status; throw e; }
  return r.json();
}
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
function draw() {
  $('#cls').innerHTML = ''; DATA.classes.forEach((c) => { const o = el('option', `${c.name} (${c.members} чел.)`); o.value = c.id; $('#cls').append(o); });
  const box = $('#classes'); box.innerHTML = '';
  if (!DATA.classes.length) box.append(el('div', 'Классов пока нет. Создайте первый.', 'muted small'));
  DATA.classes.forEach((c) => {
    const row = el('div', null, 'tbl'), t = el('div', null, 't');
    t.append(el('b', c.name), el('span', `${c.members} чел. · код для студентов:`));
    t.append(el('code', c.code, 'k'));
    const del = el('button', 'Удалить', 'ghost'); del.onclick = async () => { if (confirm('Удалить класс «' + c.name + '» и его задания?')) { DATA = await call({ action: 'class_delete', class_id: c.id }); draw(); } };
    row.append(t, del); box.append(row);
  });
  const tl = $('#tasks'); tl.innerHTML = '';
  if (!DATA.tasks.length) tl.append(el('div', 'Пока ничего не назначено.', 'muted small'));
  DATA.tasks.forEach((k) => {
    const cn = (DATA.classes.find((c) => c.id === k.class_id) || {}).name || '';
    const row = el('div', null, 'tbl'), t = el('div', null, 't');
    t.append(el('b', k.title), el('span', [cn, k.day, k.due ? 'до ' + k.due : '', k.note || ''].filter(Boolean).join(' · ')));
    const del = el('button', 'Убрать', 'ghost'); del.onclick = async () => { DATA = await call({ action: 'unassign', id: k.id }); draw(); };
    row.append(t, del); tl.append(row);
  });
}
async function enter(code, quiet) {
  CODE = code;
  try { DATA = await call({ action: 'list' }); } catch (e) {
    if (!quiet) { $('#err').textContent = e.status === 403 ? 'Неверный код.' : 'Нет связи с сервером.'; $('#err').hidden = false; }
    CODE = ''; try { localStorage.removeItem('mr_teacher'); } catch (x) {} return;
  }
  try { localStorage.setItem('mr_teacher', code); } catch (x) {}
  $('#login').hidden = true; $('#work').hidden = false; draw();
}
$('#enter').onclick = () => enter($('#code').value.trim());
$('#code').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#enter').click(); });
$('#exit').onclick = () => { try { localStorage.removeItem('mr_teacher'); } catch (x) {} location.reload(); };
$('#addCls').onclick = async () => {
  const name = $('#newName').value.trim(); if (!name) return;
  try { DATA = await call({ action: 'class_create', name }); $('#newName').value = ''; draw(); } catch (e) { alert(e.status === 409 ? 'Такой класс уже есть.' : 'Не получилось.'); }
};
$('#assign').onclick = async () => {
  const cid = +$('#cls').value, lec = $('#lec').value; if (!cid || !lec) return;
  const title = lecs.find((l) => l.id === lec).title, b = $('#assign'); b.disabled = true;
  try {
    const d = await call({ action: 'assign', class_id: cid, lecture: lec, title, note: $('#note').value, due: $('#due').value || null });
    DATA = d; draw();
    $('#res').textContent = `Задание назначено. Сообщение в Telegram получили ${d.sent} из ${d.members} студентов.`; $('#res').hidden = false; $('#note').value = '';
  } catch (e) { $('#res').textContent = 'Не получилось назначить.'; $('#res').hidden = false; }
  b.disabled = false;
};
try { const c = localStorage.getItem('mr_teacher'); if (c) enter(c, true); } catch (e) {}
</script>
</body>
</html>
